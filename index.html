<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101114">
  <title>Virtual Player</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="shell">
    <section id="loginView" class="card login-card">
      <h1>Virtual Player</h1>
      <p class="muted">Log ind for at åbne dit private musikbibliotek.</p>
      <form id="loginForm">
        <label>E-mail<input id="email" type="email" autocomplete="username" required></label>
        <label>Adgangskode<input id="password" type="password" autocomplete="current-password" required></label>
        <button id="loginBtn" type="submit">Log ind</button>
        <p id="loginMsg" class="message"></p>
      </form>
    </section>

    <section id="playerView" class="hidden">
      <header class="topbar">
        <div><h1>Virtual Player</h1><p id="userLabel" class="muted small"></p></div>
        <button id="logoutBtn" class="secondary">Log ud</button>
      </header>

      <section class="card now-playing">
        <div class="disc">♪</div>
        <div class="track-info"><span class="eyebrow">AFSPILLER NU</span><h2 id="trackTitle">Vælg et nummer</h2><p id="nowFolder" class="muted small"></p></div>
        <audio id="audio" preload="metadata"></audio>
        <div class="time-row"><span id="currentTime">0:00</span><input id="seek" type="range" min="0" max="100" value="0"><span id="duration">0:00</span></div>
        <div class="controls"><button id="prevBtn" aria-label="Forrige">⏮</button><button id="playBtn" class="play" aria-label="Afspil">▶</button><button id="nextBtn" aria-label="Næste">⏭</button></div>
        <div class="volume"><span>🔊</span><input id="volume" type="range" min="0" max="1" step="0.05" value="0.8"></div>
      </section>

      <section class="card library">
        <div class="library-head"><div><span class="eyebrow">DIT BIBLIOTEK</span><h2 id="libraryTitle">Alle numre</h2></div><button id="refreshBtn" class="secondary">↻ Opdater</button></div>
        <p id="status" class="muted"></p>
        <div id="folders" class="folders"></div>
        <div id="playlist" class="playlist"></div>
      </section>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</body>
</html>
